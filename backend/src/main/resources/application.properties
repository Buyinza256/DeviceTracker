spring.application.name=device-monitor

# ---- Datasource (PostgreSQL) ----
# Override via environment variables in docker / production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/device_monitor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:device_monitor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:device_monitor}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
# Liquibase owns the schema; Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Liquibase migrations ----
spring.liquibase.change-log=classpath:liquibase/db.changelog.xml

# ---- Domain configuration ----
# A device is considered stale if it has not reported within this window.
monitoring.stale-after-minutes=15
monitoring.cors.allowed-origins=http://localhost:5173

server.port=8080
