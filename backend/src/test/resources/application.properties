spring.application.name=device-monitor-test

# In-memory H2 in PostgreSQL-compatibility mode. The real Liquibase migrations
# run against it, so tests exercise the same schema the application ships with.
spring.datasource.url=jdbc:h2:mem:device_monitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:liquibase/db.changelog.xml

monitoring.stale-after-minutes=15
