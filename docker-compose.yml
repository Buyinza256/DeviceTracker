services:
  db:
    image: postgres:16-alpine
    container_name: device-monitor-db
    environment:
      POSTGRES_DB: device_monitor
      POSTGRES_USER: device_monitor
      POSTGRES_PASSWORD: device_monitor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device_monitor -d device_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: device-monitor-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/device_monitor
      SPRING_DATASOURCE_USERNAME: device_monitor
      SPRING_DATASOURCE_PASSWORD: device_monitor
      # Allow the Vite dev server origin to call the API.
      MONITORING_CORS_ALLOWED-ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  db_data:
